<!DOCTYPE html>
<html>
<head>
  <title>Counter</title>
<style>
<body>
 body {
        
            background-color: ligthblue;
            display: flex;
            align-items: center;
            height: 100vh;
        }

        .box {
            background-color: lightblue;
            width: 300px;
            padding: 60px;
            text-align: center;
            border: 10px;
        }

         .increment {
            background-color: green;
            color: white;
        }

        .decrement {
            background-color: red;
            color: white;
        }

        .reset {
            background-color: black;
            color: white;
        }

</style>

</head>

<body>

    <div class="box">

        <h1>Interactive Counter</h1>

        <div id="number">0</div>

        <button class="increment" onclick="increase()">+1</button>

        <button class="decrement" onclick="decrease()">-1</button>

        <button class="reset" onclick="reset()">Reset</button>

    </div>


</body>
</html>
